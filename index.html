<title>颈椎飞行员</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{ --ink:#3a4a52; --ink-soft:#6b7f8a; --gold:#e8a93c; --accent:#5b7c99;
    --panel:rgba(255,255,255,.93); --good:#4f9d7a; --bad:#d4756b; }
  html,body{margin:0;padding:0;height:100%;}
  body{background:#f6e3d2; color:var(--ink);
    font-family:'Nunito',-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;}
  #cv{position:fixed; inset:0; width:100vw; height:100vh; display:block;}
  .hud{position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:flex-start; padding:12px 12px 0; pointer-events:none; z-index:5;
    font-variant-numeric:tabular-nums; gap:8px;}
  .hud .stat{background:var(--panel); border-radius:12px; padding:5px 10px; font-size:14px;
    font-weight:800; box-shadow:0 2px 10px rgba(58,74,82,.14); line-height:1.3; text-align:center;
    display:flex; align-items:center; gap:5px;}
  .hud .stat small{display:block; font-size:9px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em;}
  .hud .stat img{width:18px; height:18px; object-fit:contain;}
  #hHearts{color:var(--bad); font-size:16px; letter-spacing:2px;}
  #timebar{position:fixed; top:0; left:0; height:5px; background:linear-gradient(90deg,var(--gold),#f7cf7e);
    width:100%; z-index:6; border-radius:0 3px 3px 0; box-shadow:0 1px 4px rgba(232,169,60,.5);}
  .overlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:13px; text-align:center;
    background:linear-gradient(180deg, rgba(191,221,228,.92), rgba(246,227,210,.95));
    backdrop-filter:blur(4px); padding:22px;}
  .overlay h1{font-size:34px; margin:0; letter-spacing:.14em; font-weight:900;
    text-shadow:0 2px 0 #fff, 0 5px 14px rgba(91,124,153,.3);}
  .overlay h2{font-size:22px; margin:0; font-weight:900;}
  #logoImg{width:120px; height:120px; object-fit:contain;
    filter:drop-shadow(0 8px 16px rgba(91,124,153,.35));
    animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
  @media (prefers-reduced-motion: reduce){#logoImg{animation:none;}}
  .overlay .sub{margin:0; max-width:32ch; color:var(--ink-soft); font-size:13px; line-height:1.7;}
  .btn{border:0; border-radius:999px; padding:13px 30px; font-size:16px; font-weight:800;
    background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(91,124,153,.35);
    cursor:pointer; font-family:inherit;}
  .btn.ghost{background:var(--panel); color:var(--accent); box-shadow:0 2px 10px rgba(58,74,82,.12);}
  .btn:active{transform:translateY(1px);}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .levels{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:360px;}
  .lv{border:0; border-radius:14px; padding:9px 13px; font-size:13px; font-weight:800;
    background:var(--panel); color:var(--ink); box-shadow:0 2px 8px rgba(58,74,82,.14);
    cursor:pointer; font-family:inherit; line-height:1.3;}
  .lv small{display:block; font-size:10px; color:var(--gold); letter-spacing:1px;}
  .lv.sel{background:var(--accent); color:#fff;}
  .lv.sel small{color:#ffe1a8;}
  .lv.lock{opacity:.45;}
  .stats-card{background:var(--panel); border-radius:18px; padding:16px 24px;
    box-shadow:0 8px 24px rgba(58,74,82,.16); min-width:230px;}
  .stats-card .stars{font-size:28px; color:var(--gold); letter-spacing:5px;
    text-shadow:0 2px 6px rgba(232,169,60,.4);}
  .stats-card .row{display:flex; justify-content:space-between; gap:22px; font-size:13px;
    padding:3px 0; color:var(--ink-soft);}
  .stats-card .row b{color:var(--ink); font-variant-numeric:tabular-nums;}
  #sensorTip{font-size:12px; color:var(--accent); font-weight:800; min-height:1.2em;}
  /* 封面动效 */
  #ovStart{background:linear-gradient(180deg, rgba(191,221,228,.42), rgba(246,227,210,.58));}
  #ovStart h1{animation:tfloat 3s ease-in-out infinite;}
  @keyframes tfloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  #btnGyro{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(91,124,153,.35);}
    50%{box-shadow:0 6px 26px rgba(91,124,153,.6), 0 0 0 7px rgba(91,124,153,.1);}}
  #ovStart .lv{animation:chipin .5s ease-out backwards;}
  @media (prefers-reduced-motion: reduce){#ovStart h1,#btnGyro,#ovStart .lv{animation:none;}}
  @keyframes chipin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  #feverbar{position:fixed; top:5px; left:0; height:4px; width:0%; z-index:6;
    background:linear-gradient(90deg,#ff8db2,#ffd75e); border-radius:0 3px 3px 0;
    transition:width .15s linear;}
  #panelToggle{position:fixed; right:10px; bottom:10px; z-index:8; border:0;
    background:var(--panel); color:var(--ink-soft); border-radius:999px; padding:7px 14px;
    font-size:11px; font-weight:800; box-shadow:0 2px 10px rgba(58,74,82,.15);
    font-family:inherit; cursor:pointer;}
  #panel{position:fixed; left:8px; right:8px; bottom:8px; z-index:9;
    background:var(--panel); border-radius:14px; padding:10px 14px 12px;
    box-shadow:0 -4px 24px rgba(58,74,82,.18); display:none; font-size:12px;}
  #panel.open{display:block;}
  #panel .prow{display:flex; align-items:center; gap:10px; padding:4px 0;}
  #panel label{width:80px; font-weight:800; color:var(--ink-soft); flex-shrink:0;}
  #panel input[type=range]{flex:1; accent-color:var(--accent);}
  #panel .val{width:40px; text-align:right; font-variant-numeric:tabular-nums; font-weight:800;}
  #panel select,#panel button.mini{font-family:inherit; font-size:12px; border-radius:8px;
    border:1px solid #cdd9de; background:#fff; padding:3px 8px; color:var(--ink);}
  #debug{margin-top:5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
    display:flex; gap:12px; flex-wrap:wrap; font-size:11px;}
</style>

<canvas id="cv"></canvas>
<div id="timebar" style="display:none"></div>
<div id="feverbar" style="display:none"></div>
<div class="hud" id="hud" style="display:none">
  <div class="stat"><small id="hLvName">第 1 关</small><span id="hHearts">♥♥♥</span></div>
  <div class="stat"><img id="hCoinIcon" alt=""><span id="hScore">0</span></div>
  <div class="stat"><small>脖子活动</small><span id="hMoves">0</span></div>
  <div class="stat"><small>剩余</small><span id="hTime">40</span>s</div>
</div>

<div class="overlay" id="ovStart">
  <img id="logoImg" alt="颈椎飞行员">
  <h1>颈椎飞行员</h1>
  <p class="sub">倾斜手机控制纸飞机：吃金币、接星星、穿石环、躲小鸟。<br>连击攒满能量条触发 FEVER 金币雨！磁铁吸币、护盾挡伤、擦鸟而过有奖励。<br>点「起飞」的瞬间就是你的姿势零点。动作轻柔，感到不适请休息。</p>
  <div class="levels" id="lvList"></div>
  <div class="btnrow">
    <button class="btn" id="btnGyro">🛫 起飞（体感）</button>
    <button class="btn ghost" id="btnTouch">👆 触控</button>
  </div>
  <div id="sensorTip"></div>
</div>

<div class="overlay" id="ovWin" style="display:none">
  <h2 id="winTitle">关卡完成！</h2>
  <div class="stats-card">
    <div class="stars" id="winStars">★★★</div>
    <div class="row"><span>金币</span><b id="winScore">0</b></div>
    <div class="row"><span>穿环</span><b id="winRings">0</b></div>
    <div class="row"><span>颈部活动</span><b id="winMoves">0 次 ≈ 0 分钟颈椎操</b></div>
  </div>
  <div class="btnrow">
    <button class="btn" id="btnNext">下一关 →</button>
    <button class="btn ghost" id="btnRetryW">再玩一次</button>
    <button class="btn ghost" id="btnMenuW">选关</button>
  </div>
</div>

<div class="overlay" id="ovFail" style="display:none">
  <h2>飞机迫降了…</h2>
  <p class="sub" id="failText">放轻松，慢慢转，再来一次。</p>
  <div class="btnrow">
    <button class="btn" id="btnRetryF">重试</button>
    <button class="btn ghost" id="btnMenuF">选关</button>
  </div>
</div>

<button id="panelToggle">调参</button>
<div id="panel">
  <div class="prow"><label>平滑 α</label>
    <input type="range" id="pAlpha" min="0.05" max="0.5" step="0.01" value="0.22">
    <span class="val" id="vAlpha">0.22</span></div>
  <div class="prow"><label>死区 (°)</label>
    <input type="range" id="pDead" min="0" max="6" step="0.5" value="2">
    <span class="val" id="vDead">2.0</span></div>
  <div class="prow"><label>灵敏度</label>
    <select id="pSens"><option value="25">轻柔 (±25°)</option>
      <option value="18" selected>标准 (±18°)</option>
      <option value="12">灵活 (±12°)</option></select>
    <button class="mini" id="pInvX">左右反转: 关</button>
    <button class="mini" id="pInvY">上下反转: 关</button></div>
  <div id="debug"><span id="dRaw">raw –</span><span id="dFil">filt –</span><span id="dFps">fps –</span><span id="dMode">mode –</span></div>
</div>

var P={alpha:0.22,dead:2,maxDeg:18,invX:1,invY:1};
try{var s=localStorage.getItem('nh-params');if(s){var o=JSON.parse(s);for(var k in P)if(o[k]!==undefined)P[k]=o[k];}}catch(e){}
function saveP(){try{localStorage.setItem('nh-params',JSON.stringify(P));}catch(e){}}
(function(){
  var a=$('pAlpha'),d=$('pDead'),se=$('pSens');
  a.value=P.alpha;d.value=P.dead;se.value=String(P.maxDeg);
  $('vAlpha').textContent=(+P.alpha).toFixed(2);$('vDead').textContent=(+P.dead).toFixed(1);
  a.oninput=function(){P.alpha=+a.value;$('vAlpha').textContent=P.alpha.toFixed(2);saveP();};
  d.oninput=function(){P.dead=+d.value;$('vDead').textContent=P.dead.toFixed(1);saveP();};
  se.onchange=function(){P.maxDeg=+se.value;saveP();};
  var bx=$('pInvX'),by=$('pInvY');
  bx.textContent='左右反转: '+(P.invX<0?'开':'关');by.textContent='上下反转: '+(P.invY<0?'开':'关');
  bx.onclick=function(){P.invX*=-1;bx.textContent='左右反转: '+(P.invX<0?'开':'关');saveP();};
  by.onclick=function(){P.invY*=-1;by.textContent='上下反转: '+(P.invY<0?'开':'关');saveP();};
})();

var PATTERNS={
  climb:function(p){return{x:Math.sin(p*6.283)*0.18,y:0.62-1.24*p};},
  dive:function(p){return{x:-Math.sin(p*6.283)*0.18,y:-0.62+1.24*p};},
  climbS:function(p){return{x:Math.sin(p*9.42)*0.12,y:0.72-1.44*p};},
  diveS:function(p){return{x:-Math.sin(p*9.42)*0.12,y:-0.72+1.44*p};},
  sweepL:function(p){return{x:-Math.sin(p*3.14)*0.72,y:0.08+Math.sin(p*6.283)*0.12};},
  sweepR:function(p){return{x:Math.sin(p*3.14)*0.72,y:-0.08+Math.sin(p*6.283)*0.12};},
  sweepLW:function(p){return{x:-Math.sin(p*3.14)*0.9,y:Math.sin(p*9.42)*0.18};},
  sweepRW:function(p){return{x:Math.sin(p*3.14)*0.9,y:Math.sin(p*9.42)*0.18};},
  circle:function(p){return{x:Math.cos(p*6.283)*0.58,y:Math.sin(p*6.283)*0.5};},
  circleR:function(p){return{x:Math.cos(-p*6.283)*0.58,y:Math.sin(-p*6.283)*0.5};},
  zigzag:function(p){var t=p*4;var seg=Math.floor(t),f=t-seg;
    var xs=[-0.7,0.7,-0.7,0.7,-0.7];var ys=[0.5,-0.5,0.5,-0.5,0.5];
    return{x:xs[seg]+(xs[seg+1]-xs[seg])*f,y:ys[seg]+(ys[seg+1]-ys[seg])*f};}
};

var mode='none',raw={b:0,g:0},zero={b:null,g:null},gotSensor=false;
var fx=0,fy=0,tgt={x:0,y:0};
window.addEventListener('deviceorientation',function(e){
  if(e.beta===null&&e.gamma===null)return;
  gotSensor=true;raw.b=e.beta||0;raw.g=e.gamma||0;
  if(mode==='gyro'){
    if(zero.b===null){zero.b=raw.b;zero.g=raw.g;}
    tgt.x=norm(raw.g-zero.g)*P.invX;tgt.y=norm(raw.b-zero.b)*P.invY;}
});
function norm(d){var s=Math.sign(d),a=Math.abs(d);
  if(a<P.dead)return 0;
  return Math.max(-1,Math.min(1,s*(a-P.dead)/(P.maxDeg-P.dead)));}
function onTouch(e){if(mode!=='touch')return;
  var t=e.touches?e.touches[0]:e;
  tgt.x=Math.max(-1,Math.min(1,(t.clientX-W/2)/(W*0.35)));
  tgt.y=Math.max(-1,Math.min(1,(t.clientY-H/2)/(H*0.3)));
  if(e.cancelable)e.preventDefault();}
window.addEventListener('touchmove',onTouch,{passive:false});
window.addEventListener('touchstart',onTouch,{passive:false});

var neck={moves:0,ax:{ext:0,dir:0},ay:{ext:0,dir:0}};
function trackAxis(A,val){var TH=8/18;var d=val-A.ext;
  if(A.dir===0){if(Math.abs(d)>0.02)A.dir=Math.sign(d);}
  else if(Math.sign(d)===-A.dir&&Math.abs(d)>TH){neck.moves++;A.ext=val;A.dir=Math.sign(d);}
  else if(Math.sign(d)===A.dir){A.ext=val;}}

var AC=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol){if(!AC)return;try{
  var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.07,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur+0.02);}catch(e){}}
function sCatch(n){tone(660+n*50,0.16);}
function sStar(){[880,1174,1568].forEach(function(f,i){setTimeout(function(){tone(f,0.15);},i*60);});}
function sRing(){tone(520,0.1);setTimeout(function(){tone(780,0.18);},70);}

function sWin(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.22);},i*110);});}

  G.coins=[];G.ringObjs=[];G.birds=[];G.starObjs=[];G.parts=[];G.floats=[];G.trail=[];
  G.segI=0;G.segP=0;G.spawnAcc=0;G.ringAcc=0;G.birdAcc=0;
  G.shake=0;G.intro=2.4;G.speed=G.lv.speed;G.flashT=0;G.dmgT=0;
  G.magnetT=0;G.shield=false;G.fever=0;G.feverOn=0;G.pickups=[];G.pickAcc=0;G.pickN=0;

function heartsStr(){return '♥♥♥'.slice(0,G.hearts)+'♡♡♡'.slice(0,3-G.hearts);}
function loseHeart(){
  if(G.feverOn>0)return;
  if(G.shield){G.shield=false;G.flashT=0.25;tone(440,0.2);
    G.floats.push({x:W/2,y:H*0.5,txt:'🛡️ 护盾抵挡！',l:1});return;}
  G.hearts--;G.shake=0.5;G.dmgT=0.5;sHit();
  $('hHearts').textContent=heartsStr();}

function endWin(){
  G.on=false;sWin();
  var ratio=G.spawned?G.score/G.spawned:0;
  var st=ratio>=G.lv.target+0.3?3:ratio>=G.lv.target+0.15?2:1;
  if((PROG.stars[G.lvI]||0)<st)PROG.stars[G.lvI]=st;
  if(G.lvI+1>=PROG.unlocked)PROG.unlocked=Math.min(5,G.lvI+2);
  saveProg();
  $('hud').style.display='none';$('timebar').style.display='none';
  $('feverbar').style.display='none';
  $('winTitle').textContent='第 '+(G.lvI+1)+' 关 · '+G.lv.name+' 完成！';
  $('winStars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('winScore').textContent=G.score+' / '+G.spawned;
  $('winRings').textContent=G.rings;
  $('winMoves').textContent=neck.moves+' 次 ≈ '+(neck.moves*4/60).toFixed(1)+' 分钟颈椎操';
  $('btnNext').style.display=(G.lvI<4)?'':'none';
  $('ovWin').style.display='flex';}

function endFail(reason){
  G.on=false;sFail();
  $('hud').style.display='none';$('timebar').style.display='none';
  $('feverbar').style.display='none';
  if(G.endless){
    if(G.score>PROG.best){PROG.best=G.score;saveProg();}
    $('failText').textContent='无尽模式结束：金币 '+G.score+'（最佳 '+PROG.best+'）· 脖子活动 '+neck.moves+' 次';
    $('ovFail').querySelector('h2').textContent='无尽飞行结束';

/* ---------- 投影与绘制 ---------- */
function project(c){var pr=FOCAL/(FOCAL+c.z);
  return{x:W/2+c.x*W*0.55*pr-fx*W*0.1*(1-pr),
         y:H*0.44+c.y*H*0.42*pr-fy*H*0.08*(1-pr),pr:pr};}
function depthAlpha(z){return Math.max(0,Math.min(1,(SPAWN_Z+0.2-z)*3.2));}

function drawBG(dt){
  if(ok('bg')){
    var iw=img.bg.naturalWidth,ih=img.bg.naturalHeight;
    var sc=Math.max(W*1.14/iw,H*1.14/ih);
    var dw=iw*sc,dh=ih*sc;
    ctx.drawImage(img.bg,(W-dw)/2-fx*W*0.06,(H-dh)/2-fy*H*0.035,dw,dh);
  }else{ctx.fillStyle='#dfeef0';ctx.fillRect(0,0,W,H);}
  // 穿云而过（3D 云）
  for(var i=0;i<skyClouds.length;i++){var c=skyClouds[i];
    c.z-=G.speed*dt*0.8; c.x+=c.drift*dt;
    if(c.z<0.06){c.z=SPAWN_Z+0.3;c.x=(Math.random()*2-1);c.y=-0.75+Math.random()*0.9;}
    var s=project(c);
    var cw=Math.max(30,340*s.pr);
    ctx.globalAlpha=0.9*depthAlpha(c.z);
    if(ok('cloud'))ctx.drawImage(img.cloud,s.x-cw/2,s.y-cw*0.3,cw,cw*0.62);
    else{ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();
      ctx.ellipse(s.x,s.y,cw/2,cw*0.28,0,0,6.283);ctx.fill();}
    ctx.globalAlpha=1;}
  // 流动地面线
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=1;
  G._grid=(G._grid||0)+dt*G.speed*3;
  for(var r=0;r<6;r++){var p=((r*0.18+G._grid)%1.08),yy=H*0.62+Math.pow(p,2.2)*H*0.38;
    ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();}
  // 高速速度线
  if(G.on&&G.speed>0.42){
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
    for(var i2=0;i2<7;i2++){var sy=(i2*83+G._grid*800)%H;
      var sx=i2%2?W*0.05:W*0.92;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+(i2%2?W*0.06:-W*0.06),sy+H*0.025);ctx.stroke();}}}

function drawCoin(s,z){
  var r=Math.max(5,34*s.pr);
  ctx.globalAlpha=depthAlpha(z);
  if(ok('coin'))ctx.drawImage(img.coin,s.x-r*1.3,s.y-r*1.3,r*2.6,r*2.6);
  else{ctx.fillStyle='#e8a93c';ctx.beginPath();ctx.arc(s.x,s.y,r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;}

function drawStar(s,z,t){
  var r=Math.max(6,44*s.pr)*(1+Math.sin(t*6)*0.08);
  ctx.globalAlpha=depthAlpha(z);
  if(ok('star'))ctx.drawImage(img.star,s.x-r*1.3,s.y-r*1.3,r*2.6,r*2.6);
  else{ctx.fillStyle='#ffd75e';ctx.beginPath();ctx.arc(s.x,s.y,r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;}

function drawRing(s,z){
  var r=Math.max(10,130*s.pr);
  ctx.globalAlpha=depthAlpha(z);
  if(ok('ring'))ctx.drawImage(img.ring,s.x-r,s.y-r,r*2,r*2);
  else{ctx.strokeStyle='#b7ad9d';ctx.lineWidth=r*0.3;
    ctx.beginPath();ctx.arc(s.x,s.y,r*0.8,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;}

function drawBird(s,z,t){
  var r=Math.max(8,64*s.pr);
  var bob=Math.sin(t*9)*r*0.12;
  ctx.globalAlpha=depthAlpha(z);
  if(ok('bird'))ctx.drawImage(img.bird,s.x-r,s.y-r+bob,r*2,r*2);
  else{ctx.fillStyle='#e88f83';ctx.beginPath();ctx.arc(s.x,s.y+bob,r*0.8,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;}

function drawPlane(px,py,roll,now){
  // 拖尾
  G.trail.push({x:px,y:py+Math.min(W,H)*0.05,l:0.45});
  if(G.trail.length>26)G.trail.shift();
  for(var i=G.trail.length-1;i>=0;i--){var tr=G.trail[i];tr.l-=0.016;
    if(tr.l<=0){G.trail.splice(i,1);continue;}
    ctx.fillStyle='rgba(255,255,255,'+(tr.l*0.75)+')';
    ctx.beginPath();ctx.arc(tr.x,tr.y,tr.l*9,0,6.283);ctx.fill();}
  var s=Math.min(W,H)*0.17;
  var bob=Math.sin(now/520)*4;
  ctx.save();ctx.translate(px,py+bob);ctx.rotate(roll);
  ctx.fillStyle='rgba(58,74,82,0.14)';
  ctx.beginPath();ctx.ellipse(0,s*0.6,s*0.48,s*0.12,0,0,6.283);ctx.fill();
  if(ok('plane'))ctx.drawImage(img.plane,-s/2,-s/2,s,s);
  else{ctx.fillStyle='#fff';ctx.beginPath();
    ctx.moveTo(0,-s*0.4);ctx.lineTo(s*0.45,s*0.3);ctx.lineTo(-s*0.45,s*0.3);
    ctx.closePath();ctx.fill();}
  ctx.restore();}

/* ---------- 主循环 ---------- */
var last=performance.now(),fpsA=60;
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  fpsA+=(1/Math.max(dt,1e-3)-fpsA)*0.05;
  fx+=(tgt.x-fx)*P.alpha;fy+=(tgt.y-fy)*P.alpha;
  ctx.save();
  if(G.shake>0){G.shake-=dt;
    ctx.translate((Math.random()-0.5)*14*G.shake*4,(Math.random()-0.5)*14*G.shake*4);}
  drawBG(dt);
  var px=W/2+fx*W*0.36,py=H*0.62+fy*H*0.24;
  if(!G.on&&MENU){
    px=W/2+Math.sin(now/1500)*W*0.2;
    py=H*0.6+Math.sin(now/1150+1.3)*H*0.06;
    if(Math.random()<dt*1.5)menuCoins.push({x:Math.random()*1.4-0.7,
      y:Math.random()*0.9-0.5,z:SPAWN_Z});
    for(var mc=menuCoins.length-1;mc>=0;mc--){var m=menuCoins[mc];m.z-=0.3*dt;
      if(m.z<=0.1){menuCoins.splice(mc,1);continue;}
      drawCoin(project(m),m.z);}
  }
  if(G.on){
    G.t+=dt;
    if(G.endless)G.speed=G.lv.speed+Math.floor(G.t/10)*0.02;
    trackAxis(neck.ax,fx);trackAxis(neck.ay,fy);
    G.segP+=dt/5;if(G.segP>=1){G.segP=0;G.segI=(G.segI+1)%G.lv.pats.length;}
    var patFn=PATTERNS[G.lv.pats[G.segI]];
    // 金币/星星生成
    G.spawnAcc+=dt;
    if(G.spawnAcc>(G.feverOn>0?0.09:0.26)){G.spawnAcc=0;var pos=patFn(G.segP);
      if(Math.random()<0.06)G.starObjs.push({x:pos.x,y:pos.y,z:SPAWN_Z});
      else{G.coins.push({x:pos.x,y:pos.y,z:SPAWN_Z});G.spawned++;}}
    // 石环生成
    if(G.lv.ringEvery>0){G.ringAcc+=dt;
      if(G.ringAcc>G.lv.ringEvery){G.ringAcc=0;var rp=patFn(Math.min(0.99,G.segP+0.25));
        G.ringObjs.push({x:rp.x,y:rp.y,z:SPAWN_Z+0.15,
          mv:G.lv.ringMove,ph:Math.random()*6.283});}}
    // 小鸟生成
    var bE=G.endless?6:G.lv.birdEvery;
    if(bE>0){G.birdAcc+=dt;
      if(G.birdAcc>bE){G.birdAcc=0;
        G.birds.push({x:(Math.random()*1.6-0.8),y:(Math.random()*0.9-0.55),
          z:SPAWN_Z+0.1,ph:Math.random()*6.283,dx:(Math.random()-0.5)*0.12});}}
    // 石环
    for(var j=G.ringObjs.length-1;j>=0;j--){var rg=G.ringObjs[j];
      rg.z-=G.speed*dt;
      if(rg.mv>0){rg.y+=Math.sin(now/400+rg.ph)*rg.mv*dt;}
      var sR=project(rg);
      if(rg.z<=0.12){
        var ddx=sR.x-px,ddy=sR.y-py,dist=Math.sqrt(ddx*ddx+ddy*ddy);
        var outerR=Math.max(10,130*sR.pr),holeR=outerR*G.lv.ringHole*1.7;
        if(dist<holeR){G.rings++;G.score+=3;sRing();G.flashT=0.25;
          G.floats.push({x:sR.x,y:sR.y,txt:'穿环 +3',l:1});
        }else if(G.lv.penalty){loseHeart();
          G.floats.push({x:px,y:py-40,txt:'-1 ♥',l:1});
          if(G.hearts<=0){G.ringObjs.splice(j,1);endFail('撞了太多东西。');break;}}
        G.ringObjs.splice(j,1);continue;}
      drawRing(sR,rg.z);}
    if(!G.on){ctx.restore();requestAnimationFrame(loop);return;}
    // 金币
    var mtx=fx*0.6545, mty=0.4286+fy*0.5714;
    for(var i=G.coins.length-1;i>=0;i--){var c=G.coins[i];c.z-=G.speed*dt;
      if(G.magnetT>0&&c.z<0.55){c.x+=(mtx-c.x)*dt*6;c.y+=(mty-c.y)*dt*6;}
      var sC=project(c);
      if(c.z<=0.12){
        var dx=sC.x-px,dy=sC.y-py,rr=Math.min(W,H)*0.09;
        if(dx*dx+dy*dy<rr*rr){
          G.score+=(G.feverOn>0?2:1);
          if(G.feverOn<=0){G.fever=Math.min(1,G.fever+0.09);
            if(G.fever>=1){G.feverOn=5;G.fever=0;sWin();G.flashT=0.4;
              G.floats.push({x:W/2,y:H*0.4,txt:'FEVER!! 金币雨',l:1.2});}}
          G.combo=(G.t-G.lastCatch<1.6)?G.combo+1:1;
          G.maxCombo=Math.max(G.maxCombo,G.combo);G.lastCatch=G.t;
          sCatch(Math.min(G.combo,8));
          G.floats.push({x:sC.x,y:sC.y,txt:G.combo>2?('x'+G.combo):'+1',l:0.8});
          for(var pI=0;pI<10;pI++)G.parts.push({x:sC.x,y:sC.y,
            vx:(Math.random()-0.5)*260,vy:(Math.random()-0.7)*260,l:0.5,c:'232,169,60'});}
        G.coins.splice(i,1);continue;}
      drawCoin(sC,c.z);}
    // 星星
    for(var si=G.starObjs.length-1;si>=0;si--){var st=G.starObjs[si];st.z-=G.speed*dt;
      var sS=project(st);
      if(st.z<=0.12){
        var dx2=sS.x-px,dy2=sS.y-py,rr2=Math.min(W,H)*0.11;
        if(dx2*dx2+dy2*dy2<rr2*rr2){
          G.score+=10;sStar();G.flashT=0.3;
          G.floats.push({x:sS.x,y:sS.y,txt:'★ +10',l:1.1});
          for(var pJ=0;pJ<16;pJ++)G.parts.push({x:sS.x,y:sS.y,
            vx:(Math.random()-0.5)*340,vy:(Math.random()-0.7)*340,l:0.7,c:'255,215,94'});}
        G.starObjs.splice(si,1);continue;}
      drawStar(sS,st.z,G.t);}
    // 小鸟
    for(var bi=G.birds.length-1;bi>=0;bi--){var bd=G.birds[bi];
      bd.z-=G.speed*dt*1.12;bd.x+=bd.dx*dt;
      var sB=project(bd);
      if(bd.z<=0.12){
        var dx3=sB.x-px,dy3=sB.y-py,rr3=Math.min(W,H)*0.09;
        if(dx3*dx3+dy3*dy3<rr3*rr3){loseHeart();
          G.floats.push({x:px,y:py-40,txt:'撞鸟 -1 ♥',l:1});
          if(G.hearts<=0){G.birds.splice(bi,1);endFail('被小鸟撞下来了。');break;}}
        else if(dx3*dx3+dy3*dy3<rr3*rr3*4.8){G.score+=2;
          G.floats.push({x:sB.x,y:sB.y,txt:'擦身 +2',l:0.9});tone(880,0.1);}
        G.birds.splice(bi,1);continue;}
      drawBird(sB,bd.z,G.t+bd.ph);}
    if(!G.on){ctx.restore();requestAnimationFrame(loop);return;}
    // 道具与 FEVER
    G.magnetT=Math.max(0,G.magnetT-dt);
    if(G.feverOn>0){G.feverOn-=dt;}
    else G.fever=Math.max(0,G.fever-0.012*dt);
    if(G.lvI>=1||G.endless){G.pickAcc+=dt;
      if(G.pickAcc>11){G.pickAcc=0;G.pickN++;
        G.pickups.push({type:(G.pickN%2?'magnet':'shield'),
          x:(Math.random()*1.2-0.6),y:(Math.random()*0.8-0.5),z:SPAWN_Z});}}
    for(var pk=G.pickups.length-1;pk>=0;pk--){var pu=G.pickups[pk];
      pu.z-=G.speed*dt;
      var sP=project(pu);
      if(pu.z<=0.12){
        var dxp=sP.x-px,dyp=sP.y-py,rrp=Math.min(W,H)*0.1;
        if(dxp*dxp+dyp*dyp<rrp*rrp){
          if(pu.type==='magnet'){G.magnetT=6;
            G.floats.push({x:sP.x,y:sP.y,txt:'🧲 吸币 6 秒',l:1});}
          else{G.shield=true;
            G.floats.push({x:sP.x,y:sP.y,txt:'🛡️ 护盾',l:1});}
          tone(700,0.15);setTimeout(function(){tone(950,0.2);},80);}
        G.pickups.splice(pk,1);continue;}
      ctx.globalAlpha=depthAlpha(pu.z);
      ctx.font=Math.max(14,64*sP.pr)+'px sans-serif';ctx.textAlign='center';
      ctx.fillText(pu.type==='magnet'?'🧲':'🛡️',sP.x,sP.y);
      ctx.globalAlpha=1;}
    // 粒子与浮字
    for(var k2=G.parts.length-1;k2>=0;k2--){var p2=G.parts[k2];p2.l-=dt;
      if(p2.l<=0){G.parts.splice(k2,1);continue;}
      p2.x+=p2.vx*dt;p2.y+=p2.vy*dt;p2.vy+=300*dt;
      ctx.fillStyle='rgba('+(p2.c||'232,169,60')+','+(p2.l*2)+')';
      ctx.beginPath();ctx.arc(p2.x,p2.y,3.5,0,6.283);ctx.fill();}
    for(var k3=G.floats.length-1;k3>=0;k3--){var fl=G.floats[k3];fl.l-=dt;
      if(fl.l<=0){G.floats.splice(k3,1);continue;}
      fl.y-=42*dt;ctx.fillStyle='rgba(79,157,122,'+Math.min(1,fl.l*2)+')';
      ctx.font='900 19px Nunito,sans-serif';ctx.textAlign='center';
      ctx.fillText(fl.txt,fl.x,fl.y);}
    // 关卡开场横幅
    if(G.intro>0){G.intro-=dt;
      var al=Math.min(1,G.intro);
      ctx.fillStyle='rgba(255,255,255,'+(al*0.88)+')';
      ctx.fillRect(0,H*0.3,W,H*0.17);
      ctx.fillStyle='rgba(58,74,82,'+al+')';ctx.textAlign='center';
      ctx.font='900 27px Nunito,sans-serif';
      ctx.fillText((G.endless?'无尽模式':'第 '+(G.lvI+1)+' 关 · '+G.lv.name),W/2,H*0.37);
      ctx.font='700 14px Nunito,sans-serif';
      ctx.fillText(G.endless?'坚持越久速度越快，掉光 3 颗心结束':G.lv.goal,W/2,H*0.43);}
    // HUD
    $('hScore').textContent=G.score;
    $('hMoves').textContent=neck.moves;
    $('hHearts').textContent=heartsStr();
    $('feverbar').style.width=((G.feverOn>0?(G.feverOn/5):G.fever)*100)+'%';
    if(G.endless){$('hTime').textContent='∞';$('timebar').style.width='100%';}
    else{$('hTime').textContent=Math.max(0,Math.ceil(G.lv.dur-G.t));
      $('timebar').style.width=Math.max(0,(1-G.t/G.lv.dur)*100)+'%';
      if(G.t>=G.lv.dur&&G.on)endTimeUp();}
  }
  drawPlane(px,py,G.on?fx*0.55:Math.cos(now/1500)*0.3,now);
  if(G.on&&G.magnetT>0){ctx.strokeStyle='rgba(232,90,90,0.45)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(px,py,Math.min(W,H)*0.13+Math.sin(now/150)*4,0,6.283);ctx.stroke();}
  if(G.on&&G.shield){ctx.font='22px sans-serif';ctx.textAlign='center';
    ctx.fillText('🛡️',px,py-Math.min(W,H)*0.12);}
  // 全屏反馈
  if(G.on&&G.feverOn>0){ctx.fillStyle='rgba(255,215,94,'+(0.10+0.06*Math.sin(now/90))+')';
    ctx.fillRect(0,0,W,H);}
  if(G.flashT>0){G.flashT-=dt;
    ctx.fillStyle='rgba(255,225,150,'+(G.flashT*0.9)+')';ctx.fillRect(0,0,W,H);}
  if(G.dmgT>0){G.dmgT-=dt;
    var gr=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
    gr.addColorStop(0,'rgba(212,117,107,0)');
    gr.addColorStop(1,'rgba(212,117,107,'+(G.dmgT*1.1)+')');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  ctx.restore();
  $('dRaw').textContent='raw β'+raw.b.toFixed(0)+' γ'+raw.g.toFixed(0);
  $('dFil').textContent='filt x'+fx.toFixed(2)+' y'+fy.toFixed(2);
  $('dFps').textContent='fps '+fpsA.toFixed(0);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
