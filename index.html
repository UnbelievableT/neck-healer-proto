<title>颈椎飞行员</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{ --ink:#3a4a52; --ink-soft:#6b7f8a; --gold:#e8a93c; --accent:#5b7c99;
    --panel:rgba(255,255,255,.93); --good:#4f9d7a; --bad:#d4756b; }
  html,body{margin:0;padding:0;height:100%;}
  body{background:#cfe3ea; color:var(--ink);
    font-family:'Nunito',-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;}
  #cv{position:fixed; inset:0; width:100vw; height:100vh; display:block;}
  .hud{position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:flex-start; padding:12px 12px 0; pointer-events:none; z-index:5;
    font-variant-numeric:tabular-nums; gap:6px;}
  .hud .stat{background:var(--panel); border-radius:12px; padding:5px 10px; font-size:14px;
    font-weight:800; box-shadow:0 2px 10px rgba(58,74,82,.14); line-height:1.3; text-align:center;
    display:flex; align-items:center; gap:5px;}
  .hud .stat small{display:block; font-size:9px; font-weight:700; color:var(--ink-soft);}
  .hud .stat img{width:17px; height:17px; object-fit:contain;}
  #hPhase{color:#fff; background:linear-gradient(135deg,#5b7c99,#8b6bb1);}
  #hHearts{color:var(--bad); font-size:16px; letter-spacing:2px;}
  #coinStat.pop{animation:cpop .18s ease-out;}
  @keyframes cpop{50%{transform:scale(1.28);}}
  #feverbar{position:fixed; top:0; left:0; height:5px; width:0%; z-index:6;
    background:linear-gradient(90deg,#ff8db2,#ffd75e); border-radius:0 3px 3px 0;
    transition:width .15s linear; display:none;}
  .overlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:13px; text-align:center;
    background:linear-gradient(180deg, rgba(191,221,228,.40), rgba(246,227,210,.55));
    backdrop-filter:blur(3px); padding:22px;}
  .overlay h1{font-size:34px; margin:0; letter-spacing:.14em; font-weight:900;
    text-shadow:0 2px 0 #fff, 0 5px 14px rgba(91,124,153,.3);
    animation:tfloat 3s ease-in-out infinite;}
  @keyframes tfloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .overlay h2{font-size:24px; margin:0; font-weight:900;}
  #logoImg{width:150px; height:150px; object-fit:contain;
    filter:drop-shadow(0 8px 16px rgba(91,124,153,.35));
    animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-12px) rotate(3deg);}}
  .overlay .sub{margin:0; max-width:34ch; color:var(--ink-soft); font-size:13px; line-height:1.75;}
  .phasehint{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:380px;}
  .ph{font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px;
    background:var(--panel); color:var(--ink-soft); box-shadow:0 2px 6px rgba(58,74,82,.12);}
  .btn{border:0; border-radius:999px; padding:13px 30px; font-size:16px; font-weight:800;
    background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(91,124,153,.35);
    cursor:pointer; font-family:inherit;}
  #btnGyro{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(91,124,153,.35);}
    50%{box-shadow:0 6px 26px rgba(91,124,153,.6), 0 0 0 7px rgba(91,124,153,.1);}}
  @media (prefers-reduced-motion: reduce){.overlay h1,#logoImg,#btnGyro{animation:none;}}
  .btn.ghost{background:var(--panel); color:var(--accent); box-shadow:0 2px 10px rgba(58,74,82,.12);}
  .btn:active{transform:translateY(1px);}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .stats-card{background:var(--panel); border-radius:18px; padding:16px 24px;
    box-shadow:0 8px 24px rgba(58,74,82,.16); min-width:240px;}
  .stats-card .big{font-size:38px; font-weight:900; color:var(--good);
    font-variant-numeric:tabular-nums;}
  .stats-card .row{display:flex; justify-content:space-between; gap:22px; font-size:13px;
    padding:3px 0; color:var(--ink-soft);}
  .stats-card .row b{color:var(--ink); font-variant-numeric:tabular-nums;}
  #best{font-size:12px; font-weight:800; color:var(--gold);}
  #sensorTip{font-size:12px; color:var(--accent); font-weight:800; min-height:1.2em;}
  #panelToggle{position:fixed; right:10px; bottom:10px; z-index:8; border:0;
    background:var(--panel); color:var(--ink-soft); border-radius:999px; padding:7px 14px;
    font-size:11px; font-weight:800; box-shadow:0 2px 10px rgba(58,74,82,.15);
    font-family:inherit; cursor:pointer;}
  #panel{position:fixed; left:8px; right:8px; bottom:8px; z-index:9;
    background:var(--panel); border-radius:14px; padding:10px 14px 12px;
    box-shadow:0 -4px 24px rgba(58,74,82,.18); display:none; font-size:12px;}
  #panel.open{display:block;}
  #panel .prow{display:flex; align-items:center; gap:10px; padding:4px 0;}
  #panel label{width:80px; font-weight:800; color:var(--ink-soft); flex-shrink:0;}
  #panel input[type=range]{flex:1; accent-color:var(--accent);}
  #panel .val{width:40px; text-align:right; font-variant-numeric:tabular-nums; font-weight:800;}
  #panel select,#panel button.mini{font-family:inherit; font-size:12px; border-radius:8px;
    border:1px solid #cdd9de; background:#fff; padding:3px 8px; color:var(--ink);}
  #debug{margin-top:5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
    display:flex; gap:12px; flex-wrap:wrap; font-size:11px;}
</style>

<canvas id="cv"></canvas>
<div id="feverbar"></div>
<div class="hud" id="hud" style="display:none">
  <div class="stat" id="hPhase"><span id="hPhaseName">晨光航线</span></div>
  <div class="stat"><small>距离</small><span id="hDist">0</span>m</div>
  <div class="stat" id="coinStat"><img id="hCoinIcon" alt=""><span id="hScore">0</span></div>
  <div class="stat"><span id="hHearts">♥♥♥</span></div>
  <div class="stat"><small>脖子</small><span id="hMoves">0</span></div>
</div>

<div class="overlay" id="ovStart">
  <img id="logoImg" alt="颈椎飞行员">
  <h1>颈椎飞行员</h1>
  <p class="sub">竖版无尽飞行：倾斜手机全向移动，吃金币、躲鸟群、防导弹。<br>和老式打飞机一个手感——看到哪，飞到哪，碰到就是碰到。<br>点「起飞」瞬间即姿势零点。动作轻柔，不适请休息。</p>
  <div class="phasehint">
    <span class="ph">🌤 晨光</span><span class="ph">🕐 午后乱流</span><span class="ph">🌇 黄昏突袭</span>
    <span class="ph">🌃 霓虹夜航</span><span class="ph">⛈ 雷暴走廊</span><span class="ph">🔥 极限领空</span>
  </div>
  <div id="best">最佳距离 0m</div>
  <div class="btnrow">
    <button class="btn" id="btnGyro">🛫 起飞（体感）</button>
    <button class="btn ghost" id="btnTouch">👆 触控</button>
  </div>
  <div id="sensorTip"></div>
</div>

<div class="overlay" id="ovEnd" style="display:none">
  <h2 id="endTitle">迫降了！</h2>
  <div class="stats-card">
    <div class="big" id="eDist">0m</div>
    <div class="row"><span>金币</span><b id="eCoins">0</b></div>
    <div class="row"><span>最高连击</span><b id="eCombo">0</b></div>
    <div class="row"><span>到达阶段</span><b id="ePhase">晨光航线</b></div>
    <div class="row"><span>颈部活动</span><b id="eMoves">0 次 ≈ 0 分钟颈椎操</b></div>
  </div>
  <div class="btnrow">
    <button class="btn" id="btnAgain">再飞一次</button>
    <button class="btn ghost" id="btnMenu">主页</button>
  </div>
</div>

<button id="panelToggle">调参</button>
<div id="panel">
  <div class="prow"><label>平滑 α</label>
    <input type="range" id="pAlpha" min="0.05" max="0.5" step="0.01" value="0.28">
    <span class="val" id="vAlpha">0.28</span></div>
  <div class="prow"><label>死区 (°)</label>
    <input type="range" id="pDead" min="0" max="6" step="0.5" value="1.5">
    <span class="val" id="vDead">1.5</span></div>
  <div class="prow"><label>灵敏度</label>
    <select id="pSens"><option value="25">轻柔 (±25°)</option>
      <option value="18" selected>标准 (±18°)</option>
      <option value="12">灵活 (±12°)</option></select>
    <button class="mini" id="pInvX">左右反转: 关</button>
    <button class="mini" id="pInvY">上下反转: 关</button></div>
  <div id="debug"><span id="dRaw">raw –</span><span id="dFil">filt –</span><span id="dFps">fps –</span><span id="dMode">mode –</span></div>
</div>

var mode='none',raw={b:0,g:0},zero={b:null,g:null},gotSensor=false;

window.addEventListener('deviceorientation',function(e){
  if(e.beta===null&&e.gamma===null)return;
  gotSensor=true;raw.b=e.beta||0;raw.g=e.gamma||0;
  if(mode==='gyro'){
    if(zero.b===null){zero.b=raw.b;zero.g=raw.g;}
    tgt.x=norm(raw.g-zero.g)*P.invX;tgt.y=norm(raw.b-zero.b)*P.invY;}

function norm(d){var sg=Math.sign(d),a=Math.abs(d);
  if(a<P.dead)return 0;
  return clamp(sg*(a-P.dead)/(P.maxDeg-P.dead),-1,1);}
function onTouch(e){if(mode!=='touch')return;
  var t=e.touches?e.touches[0]:e;
  tgt.x=clamp((t.clientX-W/2)/(W*0.4),-1,1);
  tgt.y=clamp((t.clientY-H*0.62)/(H*0.3),-1,1);
  if(e.cancelable)e.preventDefault();}
window.addEventListener('touchmove',onTouch,{passive:false});
window.addEventListener('touchstart',onTouch,{passive:false});

var neck={moves:0,ax:{ext:0,dir:0},ay:{ext:0,dir:0}};
function trackAxis(A,val){var TH=8/18;var d=val-A.ext;
  if(A.dir===0){if(Math.abs(d)>0.02)A.dir=Math.sign(d);}
  else if(Math.sign(d)===-A.dir&&Math.abs(d)>TH){neck.moves++;A.ext=val;A.dir=Math.sign(d);}
  else if(Math.sign(d)===A.dir){A.ext=val;}}

var AC=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol){if(!AC)return;try{
  var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.07,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur+0.02);}catch(e){}}

/* ===== 颈椎操引导 ===== */
var GDM=[{k:'lr',name:'左右转头',icon:'↔️',dur:12},
 {k:'ud',name:'抬头低头',icon:'↕️',dur:12},
 {k:'cir',name:'绕环画圈',icon:'🔄',dur:12},

var GD={i:0,t:0,gx:0.5,gy:0.62,on:true,inT:0,bonusA:0};
function guidePos(ta){var gm=GDM[GD.i],tt=GD.t+ta;
  if(gm.k==='lr')return{x:0.5+0.36*Math.sin(tt*0.85),y:0.62};
  if(gm.k==='ud')return{x:0.5,y:0.62+0.19*Math.sin(tt*0.85)};
  if(gm.k==='cir')return{x:0.5+0.30*Math.cos(tt*1.0),y:0.62+0.16*Math.sin(tt*1.0)};
  return null;}

function scrollSpd(){var ph=phaseAt(G.t);
  var extra=G.t>150?Math.min(0.35,(G.t-150)*0.0045):0;
  return H*0.42*(ph.spd+extra)*(G.slowT>0?0.55:1);}

function startGame(m){

  G.magnetT=0;G.shield=false;G.slowT=0;G.dblT=0;G.fever=0;G.feverOn=0;

function loseHeart(){

/* ===== 生成 ===== */
function spawnCoinFormation(){
  var cs=Math.min(W,H)*0.052;
  var kind=Math.floor(Math.random()*5);
  var gp=GD.on?guidePos(1.1):null;
  var cx=gp?clamp(gp.x*W+(Math.random()-0.5)*W*0.12,W*0.12,W*0.88)
           :W*(0.18+Math.random()*0.64);
  var add=function(x,y){G.objs.push({k:Math.random()<0.04?'star':'coin',
    x:clamp(x,cs,W-cs),y:y});};
  if(kind===0){for(var i=0;i<5;i++)add(cx+(i-2)*cs*2.2,-cs-Math.abs(i-2)*8);}
  else if(kind===1){for(var i1=0;i1<7;i1++)add(cx+Math.sin(i1*0.9)*W*0.14,-cs-i1*cs*2.0);}
  else if(kind===2){for(var i2=0;i2<6;i2++)add(cx,-cs-i2*cs*2.0);}
  else if(kind===3){for(var i3=0;i3<7;i3++){var a=Math.PI*(0.15+0.7*i3/6);
    add(cx+Math.cos(a)*W*0.2,-cs-Math.sin(a)*90);}}
  else{for(var i4=0;i4<6;i4++)add(cx+(i4-2.5)*cs*1.8,-cs-i4*cs*1.8);}}

function spawnBirdWall(){
  var s=Math.min(W,H)*0.09;
  var gapC=W*(0.18+Math.random()*0.64),gapW=Math.min(W,H)*0.24;
  for(var x=s;x<W;x+=s*1.9){
    if(Math.abs(x-gapC)<gapW)continue;
    G.objs.push({k:'bird',x:x,y:-s-Math.random()*20,ph:Math.random()*6.283,sw:8,wall:true,nm:true});}
  G.floats.push({x:W/2,y:H*0.35,txt:'🕊 鸟群来袭！从缺口穿过',l:1.4,big:true});
  sWarn();}

/* ===== 主循环 ===== */
var last=performance.now(),fpsA=60;
function loop(now){
  var rdt=Math.min(0.05,(now-last)/1000);last=now;
  fpsA+=(1/Math.max(rdt,1e-3)-fpsA)*0.05;
  if(tsRec>0){tsRec-=rdt;if(tsRec<=0)ts=1;}
  var dt=rdt*ts;
  fx+=(tgt.x-fx)*P.alpha;fy+=(tgt.y-fy)*P.alpha;
  var ph=phaseAt(G.t);
  // 天色渐变
  for(var c=0;c<3;c++){skyTop[c]=lerp(skyTop[c],ph.top[c],rdt*1.2);
    skyBot[c]=lerp(skyBot[c],ph.bot[c],rdt*1.2);}
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'rgb('+skyTop.map(Math.round).join(',')+')');
  grd.addColorStop(1,'rgb('+skyBot.map(Math.round).join(',')+')');
  ctx.save();
  if(G.shake>0){G.shake-=rdt;
    ctx.translate((Math.random()-0.5)*16*G.shake*4,(Math.random()-0.5)*16*G.shake*4);}
  ctx.fillStyle=grd;ctx.fillRect(-20,-20,W+40,H+40);
  // 夜空星星
  var darkness=1-skyTop[0]/186;
  if(darkness>0.3){ctx.fillStyle='rgba(255,255,255,'+(darkness*0.8)+')';
    for(var st2=0;st2<stars.length;st2++){var sr=stars[st2];
      ctx.globalAlpha=darkness*(0.4+0.6*Math.abs(Math.sin(now/700+sr[2]*7)));
      ctx.beginPath();ctx.arc(sr[0]*W,sr[1]*H,1.3,0,6.283);ctx.fill();}
    ctx.globalAlpha=1;}
  // 雷暴闪电
  if(ph.at>=110&&G.on){G.boltT-=rdt;
    if(G.boltT<=0){G.boltT=2.5+Math.random()*4;G.flashT=Math.max(G.flashT,0.13);G.flashC='255,255,255';}}
  // 背景云（下滚视差）
  var spd=G.on?scrollSpd():H*0.12;
  for(var b=0;b<bgClouds.length;b++){var bc=bgClouds[b];
    bc.y+=spd*bc.sp*dt/H;
    if(bc.y>1.2){bc.y=-0.25;bc.x=Math.random();}
    var cw=W*0.3*bc.sc;
    ctx.globalAlpha=0.5;
    if(ok('cloud'))ctx.drawImage(img.cloud,bc.x*W-cw/2,bc.y*H,cw,cw*0.62);
    ctx.globalAlpha=1;}
  // 速度线
  if(spd>H*0.5){var neon=ph.at>=75;
    for(var i5=0;i5<7;i5++){
      ctx.strokeStyle=neon?(i5%2?'rgba(90,220,255,0.5)':'rgba(255,110,220,0.45)'):'rgba(255,255,255,0.4)';
      ctx.lineWidth=2;
      var sx=(i5*137)%W,sy=((G._sl||0)*1.6+i5*191)%H;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+H*0.06);ctx.stroke();}}
  G._sl=((G._sl||0)+spd*rdt);
  // 飞机位置（全向）
  var s=Math.min(W,H)*0.19;
  var px=clamp(W*(0.5+fx*0.44),s*0.5,W-s*0.5);
  var py=clamp(H*(0.64+fy*0.22),H*0.3,H-s*0.6);
  if(!G.on&&MENU){
    px=W/2+Math.sin(now/1500)*W*0.18;
    py=H*0.62+Math.sin(now/1150+1.3)*H*0.05;
    if(Math.random()<rdt*2)G.objs.push({k:'coin',x:Math.random()*W*0.8+W*0.1,y:-40,menu:true});
  }
  var collectR=s*0.46, hurtR=s*0.27;
  if(G.dying>0){
    G.dying-=rdt;
    py=py+(1.3-G.dying)*H*0.35*(1.3-G.dying);
    drawPlaneSprite(px,py,(1.3-G.dying)*7,s,now);
    ctx.restore();
    if(G.dying<=0){ts=1;gameOver();}
    requestAnimationFrame(loop);return;}
  if(G.on){
    G.t+=dt;G.dist+=10*ph.spd*dt;
    trackAxis(neck.ax,fx);trackAxis(neck.ay,fy);
    // 阶段切换
    var nI=PH.indexOf(ph);
    if(nI!==G.phI){G.phI=nI;G.phBanner=2.2;sPhase();
      G.flashT=0.3;G.flashC='255,255,255';
      $('hPhaseName').textContent=ph.icon+' '+ph.name;
      if(nI>=2&&!G.wallDone[nI]){G.wallDone[nI]=true;spawnBirdWall();}}
    // 颈椎操引导
    GD.t+=dt;var gm=GDM[GD.i];
    if(GD.t>gm.dur){GD.t=0;GD.i=(GD.i+1)%GDM.length;gm=GDM[GD.i];
      G.floats.push({x:W/2,y:H*0.3,txt:gm.icon+' '+gm.name+(gm.k==='free'?'':' · 跟着光圈飞'),l:1.4,big:true});
      tone(700,0.12);}
    GD.on=(gm.k!=='free');
    if(GD.on){
      var gpNow=guidePos(0);GD.gx=gpNow.x;GD.gy=gpNow.y;
      var gpx=GD.gx*W,gpy=GD.gy*H;
      var gin=(px-gpx)*(px-gpx)+(py-gpy)*(py-gpy)<(s*1.25)*(s*1.25);
      if(gin){GD.inT+=dt;GD.bonusA+=dt;
        if(GD.bonusA>4){GD.bonusA=0;G.coins+=5;popCoin();tone(760,0.12);
          G.floats.push({x:px,y:py-60,txt:'跟练 +5',l:0.9,big:false});}}
      else GD.bonusA=Math.max(0,GD.bonusA-dt*0.5);
      var gg2=ctx.createRadialGradient(gpx,gpy,0,gpx,gpy,s*1.5);
      gg2.addColorStop(0,'rgba(120,220,180,'+(gin?0.28:0.16)+')');
      gg2.addColorStop(1,'rgba(120,220,180,0)');
      ctx.fillStyle=gg2;ctx.beginPath();ctx.arc(gpx,gpy,s*1.5,0,6.283);ctx.fill();
      ctx.strokeStyle='rgba(79,157,122,'+(gin?0.9:0.5)+')';ctx.lineWidth=3;
      ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(gpx,gpy,s*1.25,0,6.283);ctx.stroke();
      ctx.setLineDash([]);
      ctx.textAlign='center';ctx.font='800 15px Nunito,sans-serif';
      var lbl=gm.icon+' '+gm.name,tw=ctx.measureText(lbl).width+26;
      ctx.fillStyle='rgba(58,74,82,0.55)';
      ctx.fillRect(W/2-tw/2,H*0.055,tw,26);
      ctx.fillStyle='#fff';ctx.fillText(lbl,W/2,H*0.055+18);}
    // 生成
    G.coinA+=dt;var cInt=(G.feverOn>0?0.35:ph.coin);
    if(G.coinA>cInt){G.coinA=0;spawnCoinFormation();}
    if(ph.bird>0){G.birdA+=dt;
      if(G.birdA>ph.bird){G.birdA=0;
        G.objs.push({k:'bird',x:W*(0.08+Math.random()*0.84),y:-60,
          ph:Math.random()*6.283,sw:30+Math.random()*40,nm:false});}}
    if(ph.pick>0){G.pickA+=dt;
      if(G.pickA>ph.pick){G.pickA=0;G.pickN++;
        var kinds=['magnet','shield','slow','dbl'];
        G.objs.push({k:kinds[G.pickN%4],x:W*(0.12+Math.random()*0.76),y:-50});}}
    if(ph.msl>0){G.mslA+=dt;
      if(G.mslA>ph.msl){G.mslA=0;sWarn();
        G.msls.push({y:0.35+Math.random()*0.5,warn:1.1,
          dir:Math.random()<0.5?1:-1});}}
    // 计时器
    G.magnetT=Math.max(0,G.magnetT-dt);
    G.slowT=Math.max(0,G.slowT-dt);
    G.dblT=Math.max(0,G.dblT-dt);
    if(G.feverOn>0)G.feverOn-=dt;else G.fever=Math.max(0,G.fever-0.012*dt);
    // 对象
    for(var i=G.objs.length-1;i>=0;i--){var o=G.objs[i];
      var vs=spd*(o.k==='bird'?1.18:(o.k==='coin'||o.k==='star')?1:0.85);
      o.y+=vs*dt;
      if(o.k==='bird')o.x+=Math.sin(G.t*3+o.ph)*(o.sw||30)*dt;
      // 磁吸：小磁力常开，大磁力道具
      if(o.k==='coin'||o.k==='star'){
        var ddx=px-o.x,ddy=py-o.y,dd=Math.sqrt(ddx*ddx+ddy*ddy);
        var pull=G.magnetT>0?H*0.35:collectR*2.3;
        if(dd<pull&&dd>1){var f=(G.magnetT>0?900:520)*dt/dd;
          o.x+=ddx*f;o.y+=ddy*f;}}
      if(o.y>H+80){G.objs.splice(i,1);continue;}
      var os=objSize(o);
      // 判定：同平面圆重叠
      var dx=o.x-px,dy=o.y-py;
      var rr=(o.k==='bird')?(os*0.42+hurtR):(os*0.55+collectR);
      if(dx*dx+dy*dy<rr*rr){
        if(o.k==='coin'){
          var gain=(G.feverOn>0?2:1)*(G.dblT>0?2:1);
          G.coins+=gain;popCoin();
          if(G.feverOn<=0){G.fever=Math.min(1,G.fever+0.07);
            if(G.fever>=1){G.feverOn=5;G.fever=0;sPhase();G.flashT=0.4;G.flashC='255,215,94';
              G.floats.push({x:W/2,y:H*0.4,txt:'FEVER!! 金币雨',l:1.3,big:true});}}
          G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
          sCatch(G.combo);
          if(G.combo%10===0)G.floats.push({x:W/2,y:H*0.34,txt:'COMBO x'+G.combo+'!',l:1.1,big:true});
          else G.floats.push({x:o.x,y:o.y,txt:'+'+gain,l:0.6,big:false});
          burst(o.x,o.y,8,'232,169,60');
        }else if(o.k==='star'){G.coins+=10;popCoin();sStar();G.flashT=0.3;G.flashC='255,215,94';
          G.floats.push({x:o.x,y:o.y,txt:'★ +10',l:1,big:false});burst(o.x,o.y,14,'255,215,94');
        }else if(o.k==='bird'){var hr=loseHeart();
          if(hr==='hit')G.floats.push({x:px,y:py-50,txt:'撞鸟 -1 ♥',l:1,big:false});
          else if(hr==='immune')G.floats.push({x:px,y:py-50,txt:'FEVER 无敌！',l:0.7,big:false});
        }else if(o.k==='magnet'){G.magnetT=6;tone(700,0.15);
          G.floats.push({x:o.x,y:o.y,txt:'🧲 全屏吸币',l:0.9,big:false});
        }else if(o.k==='shield'){G.shield=true;tone(760,0.15);
          G.floats.push({x:o.x,y:o.y,txt:'🛡️ 护盾',l:0.9,big:false});
        }else if(o.k==='slow'){G.slowT=5;tone(500,0.2);
          G.floats.push({x:o.x,y:o.y,txt:'⏳ 时缓',l:0.9,big:false});
        }else if(o.k==='dbl'){G.dblT=8;tone(820,0.15);
          G.floats.push({x:o.x,y:o.y,txt:'✖️2 双倍',l:0.9,big:false});}
        G.objs.splice(i,1);continue;}
      // 擦身
      if(o.k==='bird'&&!o.nm){var rr2=(os*0.42+hurtR)*2.0;
        if(dx*dx+dy*dy<rr2*rr2){o.nm=true;G.coins+=2;tone(880,0.1);
          ts=0.4;tsRec=0.2;
          G.floats.push({x:o.x,y:o.y,txt:'擦身 +2',l:0.8,big:false});}}
      drawObjFlat(o,os,now);}
    // 导弹
    for(var mi=G.msls.length-1;mi>=0;mi--){var ms=G.msls[mi];
      var myy=ms.y*H;
      if(ms.warn>0){ms.warn-=dt;
        if(Math.sin(now/60)>0){ctx.strokeStyle='rgba(230,60,60,0.75)';ctx.lineWidth=2;
          ctx.setLineDash([14,10]);
          ctx.beginPath();ctx.moveTo(0,myy);ctx.lineTo(W,myy);ctx.stroke();
          ctx.setLineDash([]);
          ctx.font='20px sans-serif';ctx.textAlign='center';
          ctx.fillText('⚠️',ms.dir>0?24:W-24,myy-14);}
        if(ms.warn<=0){ms.px=ms.dir>0?-40:W+40;}
        continue;}
      ms.px+=ms.dir*W*1.35*dt;
      var grad=ctx.createLinearGradient(ms.px-70*ms.dir,myy,ms.px,myy);
      grad.addColorStop(0,'rgba(255,120,60,0)');grad.addColorStop(1,'rgba(255,90,40,0.95)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.ellipse(ms.px,myy,36,10,0,0,6.283);ctx.fill();
      ctx.fillStyle='#ffd9a0';
      ctx.beginPath();ctx.arc(ms.px+15*ms.dir,myy,8,0,6.283);ctx.fill();
      var dxm=ms.px-px,dym=myy-py;
      if(dxm*dxm+dym*dym<(hurtR+13)*(hurtR+13)){var hr2=loseHeart();
        if(hr2==='hit')G.floats.push({x:px,y:py-50,txt:'导弹 -1 ♥',l:1,big:false});
        else if(hr2==='immune')G.floats.push({x:px,y:py-50,txt:'FEVER 无敌！',l:0.7,big:false});
        G.msls.splice(mi,1);continue;}
      if(ms.px<-90||ms.px>W+90)G.msls.splice(mi,1);}
    // 阶段横幅
    if(G.phBanner>0){G.phBanner-=rdt;
      var al=clamp(G.phBanner,0,1);
      ctx.fillStyle='rgba(255,255,255,'+(al*0.88)+')';
      ctx.fillRect(0,H*0.28,W,H*0.14);
      ctx.fillStyle='rgba(58,74,82,'+al+')';ctx.textAlign='center';
      ctx.font='900 28px Nunito,sans-serif';
      ctx.fillText(ph.icon+' '+ph.name,W/2,H*0.35);
      ctx.font='700 13px Nunito,sans-serif';
      ctx.fillText(G.t<1?'吃金币攒 FEVER，活得越久世界越疯':'难度提升！新威胁出现',W/2,H*0.40);}
    // HUD
    $('hDist').textContent=Math.floor(G.dist);
    $('hScore').textContent=G.coins;
    $('hHearts').textContent='♥♥♥'.slice(0,G.hearts)+'♡♡♡'.slice(0,3-G.hearts);
    $('hMoves').textContent=neck.moves;
    $('feverbar').style.width=((G.feverOn>0?(G.feverOn/5):G.fever)*100)+'%';
  }else{
    // 菜单氛围金币
    for(var i6=G.objs.length-1;i6>=0;i6--){var o2=G.objs[i6];
      o2.y+=spd*rdt;
      if(o2.y>H+60){G.objs.splice(i6,1);continue;}
      drawObjFlat(o2,objSize(o2),now);}}
  // 粒子/浮字
  for(var k2=G.parts.length-1;k2>=0;k2--){var p2=G.parts[k2];p2.l-=rdt;
    if(p2.l<=0){G.parts.splice(k2,1);continue;}
    p2.x+=p2.vx*rdt;p2.y+=p2.vy*rdt;p2.vy+=300*rdt;
    ctx.fillStyle='rgba('+(p2.c||'232,169,60')+','+clamp(p2.l*2,0,1)+')';
    ctx.beginPath();ctx.arc(p2.x,p2.y,3.5,0,6.283);ctx.fill();}
  for(var k3=G.floats.length-1;k3>=0;k3--){var fl=G.floats[k3];fl.l-=rdt;
    if(fl.l<=0){G.floats.splice(k3,1);continue;}
    fl.y-=42*rdt;
    ctx.fillStyle='rgba(79,157,122,'+clamp(fl.l*2,0,1)+')';
    ctx.font=(fl.big?'900 32px':'900 19px')+' Nunito,sans-serif';
    ctx.textAlign='center';ctx.fillText(fl.txt,fl.x,fl.y);}
  // 拖尾 + 飞机
  drawPlaneSprite(px,py,(tgt.x-fx)*1.2+fx*0.35,s,now);
  if(G.on&&G.magnetT>0){ctx.strokeStyle='rgba(232,90,90,0.45)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(px,py,s*0.75+Math.sin(now/150)*5,0,6.283);ctx.stroke();}
  if(G.on&&G.shield){ctx.strokeStyle='rgba(120,200,255,0.7)';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(px,py,s*0.62,0,6.283);ctx.stroke();}
  if(G.on&&G.dblT>0){ctx.font='18px sans-serif';ctx.textAlign='center';
    ctx.fillText('✖️2',px+s*0.6,py-s*0.5);}
  // FEVER 边框
  if(G.on&&G.feverOn>0){
    var hue=(now/6)%360;
    ctx.strokeStyle='hsla('+hue+',90%,60%,0.85)';ctx.lineWidth=10+Math.sin(now/80)*4;
    ctx.strokeRect(6,6,W-12,H-12);}
  if(G.flashT>0){G.flashT-=rdt;
    ctx.fillStyle='rgba('+G.flashC+','+clamp(G.flashT*0.9,0,0.5)+')';ctx.fillRect(0,0,W,H);}
  if(G.dmgT>0){G.dmgT-=rdt;
    var gr=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
    gr.addColorStop(0,'rgba(212,117,107,0)');
    gr.addColorStop(1,'rgba(212,117,107,'+clamp(G.dmgT*1.1,0,0.8)+')');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  ctx.restore();
  $('dRaw').textContent='raw β'+raw.b.toFixed(0)+' γ'+raw.g.toFixed(0);
  $('dFil').textContent='filt x'+fx.toFixed(2)+' y'+fy.toFixed(2);
  $('dFps').textContent='fps '+fpsA.toFixed(0);
  requestAnimationFrame(loop);}

function objSize(o){
  if(o.k==='coin')return Math.min(W,H)*0.052*2;
  if(o.k==='star')return Math.min(W,H)*0.062*2*(1+Math.sin(G.t*6)*0.06);
  if(o.k==='bird')return Math.min(W,H)*0.09*2;
  return Math.min(W,H)*0.055*2;}

function drawObjFlat(o,os,now){
  if(o.k==='coin'&&ok('coin'))ctx.drawImage(img.coin,o.x-os/2,o.y-os/2,os,os);
  else if(o.k==='star'&&ok('star'))ctx.drawImage(img.star,o.x-os/2,o.y-os/2,os,os);
  else if(o.k==='bird'&&ok('bird')){
    var bob=Math.sin((G.t+(o.ph||0))*9)*os*0.06;
    ctx.drawImage(img.bird,o.x-os/2,o.y-os/2+bob,os,os);}
  else if(o.k==='magnet'||o.k==='shield'||o.k==='slow'||o.k==='dbl'){
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(now/300)*0.15);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();ctx.arc(0,0,os*0.52,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(91,124,153,0.5)';ctx.lineWidth=3;ctx.stroke();
    ctx.font=(os*0.6)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText(o.k==='magnet'?'🧲':o.k==='shield'?'🛡️':o.k==='slow'?'⏳':'✖️',0,os*0.22);
    ctx.restore();}
  else{ctx.fillStyle='#e8a93c';ctx.beginPath();ctx.arc(o.x,o.y,os/2,0,6.283);ctx.fill();}}

function drawPlaneSprite(px,py,roll,s,now){
  G.trail.push({x:px,y:py+s*0.42,l:0.4});
  if(G.trail.length>22)G.trail.shift();
  for(var i=G.trail.length-1;i>=0;i--){var tr=G.trail[i];tr.l-=0.018;
    if(tr.l<=0){G.trail.splice(i,1);continue;}
    ctx.fillStyle='rgba(255,255,255,'+(tr.l*0.7)+')';
    ctx.beginPath();ctx.arc(tr.x,tr.y,tr.l*10,0,6.283);ctx.fill();}
  var bob=Math.sin(now/520)*3;
  ctx.save();ctx.translate(px,py+bob);ctx.rotate(clamp(roll,-0.5,0.5)*0.6);
  if(ok('plane'))ctx.drawImage(img.plane,-s/2,-s/2,s,s);
  else{ctx.fillStyle='#fff';ctx.beginPath();
    ctx.moveTo(0,-s*0.4);ctx.lineTo(s*0.4,s*0.3);ctx.lineTo(-s*0.4,s*0.3);
    ctx.closePath();ctx.fill();}
  ctx.restore();}

function burst(x,y,n,c){for(var i=0;i<n;i++)G.parts.push({x:x,y:y,
  vx:(Math.random()-0.5)*280,vy:(Math.random()-0.8)*280,l:0.55,c:c});}
function popCoin(){var el=$('coinStat');el.classList.remove('pop');
  void el.offsetWidth;el.classList.add('pop');}

requestAnimationFrame(loop);
})();
</script>
